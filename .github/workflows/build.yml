# Builds the Windows folder app (BakeDelight-windows.zip). Run it from the Actions tab, or push a
# v* tag to also attach the zip to that release. The de-lighter model is not in git: it is read
# from the release tagged model-overcast, AutoRemesher from the one tagged build-tools (a copy of its
# 1.2.0 Windows zip: GitHub's download of the original kept timing out).
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements.txt
      - name: Fetch the de-lighter model
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download model-overcast --pattern overcast.onnx --dir models
      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content bakedelight/__init__.py) -replace '^__version__ = .*', "__version__ = `"$version`"" | Set-Content bakedelight/__init__.py
      - name: Build
        run: pyinstaller packaging/BakeDelight.spec --noconfirm
      - name: Add AutoRemesher 1.2.0 (MIT) and the licence notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-tools --pattern autoremesher-1.2.0-win32-x86_64.zip
          $zip = "autoremesher-1.2.0-win32-x86_64.zip"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "F6184622CEF84F0BCF032A0474DF44E2076F4C10C159F1AF0CB7230259AF7476") {
            throw "the AutoRemesher download does not match the 1.2.0 release"
          }
          Expand-Archive $zip dist/BakeDelight/tools/autoremesher
          Copy-Item packaging/licenses/autoremesher-LICENSE.txt dist/BakeDelight/tools/autoremesher/LICENSE.txt
          New-Item -ItemType Directory dist/BakeDelight/licenses | Out-Null
          Copy-Item packaging/licenses/* dist/BakeDelight/licenses
          Copy-Item LICENSE dist/BakeDelight/licenses/LICENSE-ai-texture-delighter.txt
      - name: Smoke test the scan job with the bundled AutoRemesher
        run: |
          python -c "import trimesh; trimesh.creation.icosphere(subdivisions=4).export('sphere.obj')"
          dist/BakeDelight/BakeDelightJob.exe sphere.obj --out smoke --remesher autoremesher --faces 300 --stage remesh
          if (-not (Test-Path smoke/work/low.obj)) { throw "the remesh stage wrote no mesh" }
          if (-not (Test-Path dist/BakeDelight/BakeDelightDebug.exe)) { throw "the debug app is missing" }
      - name: Zip
        run: Compress-Archive -Path dist/BakeDelight -DestinationPath BakeDelight-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BakeDelight-windows
          path: BakeDelight-windows.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} BakeDelight-windows.zip --clobber
